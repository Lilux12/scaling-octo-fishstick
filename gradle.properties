# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# Эти значения НЕ обязательно актуальны — при сборке через GitHub Actions
# они автоматически перезаписываются актуальными (см. .github/workflows/build.yml,
# шаг "Resolve latest Fabric toolchain versions"). Для локальной сборки
# проверяй https://fabricmc.net/develop
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5

# Mod Properties
mod_version=1.0.0
maven_group=ru.danya.autosorter
archives_base_name=autosorter

# Dependencies
fabric_version=0.141.1+1.21.11
